name: 研究数据抓取 (research fetch)

# 仅在推送到 claude/xfer* 分支或手动触发时运行。抓取的公开数据在输出前用公钥加密（scripts/xfer_pub.pem），
# 只有持有私钥的开发环境能解密，原始数据不会以明文形式出现在公开仓库、日志或 artifact 中。
on:
  workflow_dispatch:
  push:
    branches: ["claude/xfer*"]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/research_fetch.py --out research_out
      - name: Encrypt and emit
        run: |
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in research_out.tar.gz -out data.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey scripts/xfer_pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.enc
          echo "XFER_KEY_BEGIN"; base64 -w 4000 k.enc; echo "XFER_KEY_END"
          echo "XFER_DATA_BEGIN"; base64 -w 4000 data.enc; echo "XFER_DATA_END"
          ls -la research_out.tar.gz data.enc
          rm -f k.bin
